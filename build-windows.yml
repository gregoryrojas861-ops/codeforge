name: Build CodeForge AI Windows Installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build application
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          python -m PyInstaller --noconfirm --clean CodeForgeAI.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "build_tools\CodeForgeAI.iss"
      - name: SHA256
        shell: pwsh
        run: |
          (Get-FileHash "installer\CodeForgeAI_Setup.exe" -Algorithm SHA256).Hash | Out-File "installer\SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: CodeForgeAI-Windows-Installer
          path: |
            installer/CodeForgeAI_Setup.exe
            installer/SHA256.txt
